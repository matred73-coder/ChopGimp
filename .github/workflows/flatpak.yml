# ═══════════════════════════════════════════════════════════════
# ChopGimp — paquet Flatpak automatique (voir docs/CI-WINDOWS.md)
#
# Même manifeste que « make build » (flatpak/org.cen_na.ChopGimp.json,
# commité, patchs relatifs) → bundle ChopGimp-<VERSION>.flatpak joint à
# la Release du tag, à côté de l'installateur Windows.
# Déclenché par un tag « v* » ou à la main (artefact seulement).
# ═══════════════════════════════════════════════════════════════
name: Flatpak

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Libérer de la place sur le disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v5

      - name: Version
        id: ver
        shell: bash
        run: |
          v=$(tr -d ' \n\r' < VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$v" ]]; then
            echo "::error::le tag $GITHUB_REF_NAME ne correspond pas à VERSION ($v)"; exit 1
          fi

      - name: flatpak et flatpak-builder
        run: |
          # Ubuntu 24.04 : AppArmor interdit les espaces de noms utilisateur
          # non privilégiés, dont bwrap (isolation de flatpak-builder) a besoin
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # flatpak-builder d'Ubuntu 24.04 = 1.4.2 : il ne passe pas encore
          # CMAKE_INSTALL_LIBDIR=lib (ajouté en 1.4.3/1.4.4), donc les modules
          # cmake (exiv2…) s'installent dans /app/lib64, hors du pkg-config de
          # meson → « Dependency exiv2 not found » au module gexiv2. Le PPA
          # flatpak/stable fournit 1.4.8, comme « make build » en local.
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak flatpak-builder ccache
          flatpak-builder --version
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Cache flatpak-builder (sources et ccache)
        uses: actions/cache@v5
        with:
          path: flatpak/.flatpak-builder
          key: flatpak-${{ hashFiles('flatpak/org.cen_na.ChopGimp.json') }}
          restore-keys: flatpak-

      - name: Compilation
        working-directory: flatpak
        run: |
          set -o pipefail
          flatpak-builder --user --ccache --disable-rofiles-fuse --force-clean \
            --install-deps-from=flathub --state-dir=.flatpak-builder \
            --repo=repo --default-branch=stable \
            --subject="ChopGimp ${{ steps.ver.outputs.version }}" \
            build-dir org.cen_na.ChopGimp.json 2>&1 | tee "$RUNNER_TEMP/build.log"
          # le cache ne garde que sources et ccache (pas les étages de build)
          rm -rf .flatpak-builder/build .flatpak-builder/rofiles build-dir

      # Les annotations sont lisibles sans compte GitHub (API publique) :
      # la fin du journal y est recopiée quand la compilation échoue.
      - name: Journal de l'échec (annotations)
        if: failure()
        run: |
          f="$RUNNER_TEMP/build.log"; [ -f "$f" ] || exit 0
          grep -n -i -E "error|erreur|failed|fatal" "$f" | tail -15 | sed 's/%/%25/g' | \
            awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=Lignes en erreur::/' ; echo
          tail -60 "$f" | cut -c1-300 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | \
            sed 's/^/::error title=Fin du journal::/' ; echo

      - name: Bundle
        run: |
          mkdir -p out
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak/repo out/ChopGimp-${{ steps.ver.outputs.version }}.flatpak \
            org.cen_na.ChopGimp stable
          (cd out && sha256sum *.flatpak > SHA256SUMS-flatpak.txt)
          ls -lh out

      - uses: actions/upload-artifact@v6
        with:
          name: chopgimp-${{ steps.ver.outputs.version }}-flatpak
          path: out/*
          retention-days: 14
          compression-level: 0

      - name: Release GitHub du tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: out/*
          fail_on_unmatched_files: true
